name: Build & Deploy HTML5 a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # SHA1 del motor Defold del proyecto. Debe coincidir SIEMPRE con la versión
  # del editor. Al actualizar Defold: obtener el sha en
  # https://github.com/defold/defold/releases (línea "Channel=stable sha1: ..."),
  # actualizar esta línea y push → el CI recompila y despliega automáticamente.
  # Punto de control post-actualización (plan §5.4): verificar gameplay completo
  # (NPCs, puertas, exhibición, inventario). Wasm esperado: ~2.39 MB (release).
  # Si el gameplay se rompe: plan §5.4/§5.5 y GOTCHA #45 (docs/DEV_GOTCHAS.md).
  DEFOLD_SHA: 574678c7d44be490d874fbed2d0ae6211feec4d9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenJDK 25 (requisito de bob)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Descargar bob.jar (URL verificada, fijada al sha1 del proyecto)
        run: curl -fsSL -o bob.jar "https://d.defold.com/archive/${{ env.DEFOLD_SHA }}/bob/bob.jar"

      - name: Compilar HTML5 (wasm-web + archive, variante release)
        # NOTA 1: en Defold 1.13.x la plataforma web es 'wasm-web' (js-web fue
        # renombrada y bob falla con "Platform js-web not supported").
        # NOTA 2: --bundle-output hace la salida determinista: bundle_out/<Titulo>/
        # NOTA 3 (RESUELTO, Sept. 2026 — plan §5.4/§5.5 + defold/defold#13125):
        # el build release fallaba porque el juego usaba APIs solo-debug
        # (tostring(hash) y el namespace profiler). Corregido: registro reverso
        # de ids (main/go_id_registry.lua) + guardia profiler en dialogue_manager.
        # La variante por defecto (release) es la válida para producción.
        run: >-
          java --enable-native-access=ALL-UNNAMED -jar bob.jar
          --platform wasm-web --archive resolve build bundle
          --bundle-output bundle_out

      - name: Aplanar salida para que index.html quede en la raiz
        run: |
          mkdir -p public
          # bob escribe bundle_out/<Titulo>/ (carpeta nombrada por el titulo del
          # proyecto, con espacios). Copiamos el contenido del primer subdirectorio
          # a public/ de forma agnostica al titulo.
          title_dir="$(find bundle_out -mindepth 1 -maxdepth 1 -type d | head -n1)"
          cp -r "$title_dir/." public/
          ls -la public/

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
